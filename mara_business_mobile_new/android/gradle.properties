org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP refuses to build under a non-ASCII path by default ("Your project path
# contains non-ASCII characters... most likely cause the build to fail on
# Windows"). A real dev machine here has a Windows account name in Chinese
# characters (C:\Users\微软\...), which trips this on every build regardless
# of where the repo itself is cloned. AGP documents this exact override for
# exactly this situation - kept in the project, not a local-only workaround,
# since any other contributor with a non-ASCII username hits the same wall.
android.overridePathCheck=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
