# render.yaml
services:
  - type: web
    name: marabusiness
    env: php
    region: oregon  # or virginia, ohio, frankfurt, singapore
    # Measured 2026-09-12 against the live site: every request — a static CSS
    # file, an /uploads/ image, the Laravel homepage itself — clusters around
    # 400ms-1s of time-to-first-byte on an already-open connection, with no
    # meaningful difference between a request Laravel never touches (a static
    # file) and one that hits the database. That pattern is the signature of
    # network round-trip distance, not application or query slowness: this
    # app's whole user base is Guinea (GNF pricing, Conakry addresses, Orange
    # Money / LengoPay), roughly 9,500-10,000 km from Oregon. None of the
    # region choices above sit close to West Africa, but `frankfurt` — roughly
    # 5,000 km from Conakry — is the nearest on offer and would likely cut the
    # round trip meaningfully. Changing `region` here is not a live migration:
    # Render provisions a new instance with a new persistent disk, so the
    # database and every uploaded file need moving over deliberately (same
    # backup-first discipline as a migration) rather than being carried across
    # automatically.
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan optimize
      chmod -R 755 storage bootstrap/cache
      # Create SQLite database if not exists
      touch storage/database.sqlite
    # N'AJOUTEZ PAS `php artisan migrate` ci-dessus, ni dans un preDeployCommand.
    #
    # La documentation de Render est explicite : « You can't access persistent
    # disks during a service's build command or pre-deploy command (these
    # commands run on separate compute). » Le disque déclaré plus bas n'est monté
    # qu'au runtime. Une migration lancée depuis le build porterait donc sur le
    # storage/database.sqlite éphémère que le `touch` ci-dessus vient de créer —
    # jeté dès le déploiement terminé — et Artisan afficherait « Migrated » sans
    # que la vraie base ait changé. L'échec serait silencieux et convaincant,
    # c'est-à-dire la pire sorte.
    #
    # Les migrations s'appliquent depuis /admin/database-maintenance, qui tourne
    # dans le processus web et voit donc le disque. La page liste ce qui est en
    # attente, copie le fichier de base, puis migre. Même remède que le bouton
    # « Synchroniser le suivi » de la page Logistiques, posé face à la même
    # contrainte (voir aussi routes/console.php).
    # No startCommand: this used to force `php artisan serve`, PHP's own
    # single-threaded development server — one request at a time, so a slow one
    # (an invoice PDF, a Stripe call) blocked every other visitor until it
    # finished. Render's native PHP environment (env: php) runs its own
    # production web server automatically when no startCommand overrides it,
    # which is what every other native PHP service on Render already relies
    # on. Confirmed live on 2026-09-12 by reading the `Server` response header
    # on afrobridgeinnov.com: it is nginx + php-fpm, not Apache as first
    # guessed here when this line could only be reasoned about, not observed
    # (no Composer, no nginx/Apache/PHP-FPM on the local dev machine). Whatever
    # nginx config Render generates for this is not a file in this repo — there
    # is no nginx.conf here to edit, and `public/.htaccess` (an Apache-only
    # mechanism) is never read by it at all.
    #
    # Without a persistent disk, the service's filesystem is ephemeral — nothing
    # written to storage/database.sqlite survives a redeploy, a restart, or the
    # instance
    # being rescheduled onto different hardware, because there was never
    # anywhere on disk that Render kept around for this service. Declaring the
    # disk here makes Render provision (or reattach, on redeploy) one persistent
    # volume mounted exactly where the database and every file this app writes
    # already live — no application code needs to change. On the very first
    # deploy after this is added, Render still needs the change applied via its
    # dashboard sync or a manual "Sync render.yaml"; it is not retroactive to a
    # service that's already running.
    disk:
      name: marabusiness-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    # config/filesystems.php's 'public_uploads' disk (product images, payment
    # proofs) writes to public/uploads — outside storage/ entirely, so those
    # files used to be wiped on every redeploy despite this disk. Fixed without
    # a second disk or moving any of the 32 write sites: App\Support\UploadsStorage
    # makes public/uploads a link (junction on Windows, symlink elsewhere) to
    # storage/app/public/uploads, which IS inside this mount. Every write still
    # targets public_path('uploads') exactly as before and lands on the
    # persisted disk without knowing it. AppServiceProvider::boot() poses the
    # link on the first request after each deploy — public/uploads is no
    # longer in git, so a fresh checkout never has it, and the disk's existing
    # content survives because nothing here ever touches storage/ at build or
    # pre-deploy time (see DatabaseMaintenance's docblock for why that's
    # impossible on Render, and UploadsStorage's docblock for two Windows-only
    # traps this took to get right: is_link() does not recognise a junction,
    # and Filesystem::link() never signals success or failure on Windows).
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /opt/render/project/src/storage/database.sqlite
    autoDeploy: true